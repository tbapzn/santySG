<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050506" />
  <meta name="description" content="Musica e nuovo album di SANTY." />
  <meta property="og:title" content="SANTY" />

  <title>SANTY</title>
  <style>
    :root {
      --bg: #050506;
      --panel: rgba(11, 12, 14, 0.9);
      --panel-soft: rgba(16, 17, 19, 0.86);
      --ink: #f4f1ea;
      --muted: #a5a19a;
      --line: rgba(255,255,255,0.12);
      --gold: #f6edd8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: rgba(5,5,6,0.52);
    }
    .backdrop::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("FOTO/cover.jpg") center 35% / cover no-repeat;
      transform: scale(1.08);
      filter: saturate(0.8) brightness(0.75);
      animation: drift 8s ease-in-out infinite alternate;
    }
    .backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,5,6,0.25), rgba(5,5,6,0.85) 72%, rgba(5,5,6,1));
    }
    @keyframes drift {
      from { transform: scale(1.06) translateY(0); }
      to { transform: scale(1.14) translateY(-10px); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(440px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 8px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
    }

    .shop-mark, .menu-btn {
      width: 42px;
      height: 42px;
      border: 0;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
    }
    .shop-mark svg { width: 20px; height: 20px; }
    .menu-btn span,
    .menu-btn span::before,
    .menu-btn span::after {
      display: block;
      width: 18px;
      height: 1.8px;
      background: currentColor;
      border-radius: 2px;
      position: relative;
      content: "";
    }
    .menu-btn span::before { position: absolute; left: 0; top: -6px; content: ""; }
    .menu-btn span::after { position: absolute; left: 0; top: 6px; content: ""; }

    .drawer {
      position: absolute;
      top: 62px;
      right: 0;
      width: min(220px, 100%);
      display: none;
      z-index: 5;
    }
    .drawer.open { display: block; }
    .drawer nav {
      border: 1px solid var(--line);
      background: rgba(12,12,14,0.96);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }
    .drawer a {
      display: block;
      padding: 10px 4px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .made-by {
      margin: 6px 0 0;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      text-align: right;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .made-by a { display: inline; padding: 0; font-weight: 800; }

    .hero {
      min-height: 150px;
    }

    .links {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--ink);
      text-decoration: none;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    }
    .link-card svg {
      width: 20px;
      height: 20px;
      flex: none;
    }
    .link-card span {
      flex: 1;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .link-card .arrow {
      font-size: 1rem;
      color: var(--muted);
    }

    .video-card {
      margin-top: 18px;
      background: rgba(15,15,18,0.82);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 48px rgba(0,0,0,0.26);
    }
    .video-head {
      padding: 12px 18px 10px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #d6d1c8;
    }
    .video-card video {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #09090a;
    }

    .music-card {
      margin-top: 18px;
      background: linear-gradient(180deg, rgba(16,17,19,0.86), rgba(8,9,10,0.9));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      backdrop-filter: blur(18px);
    }
    .card-heading {
      padding: 18px 18px 8px;
    }
    .release-kicker {
      margin: 0;
      font-size: 0.63rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #d7d2ca;
      text-transform: uppercase;
    }
    .release-title {
      margin: 4px 0 0;
      color: #f7f4ee;
      font-family: "Permanent Marker", "Comic Sans MS", cursive;
      font-size: 1.85rem;
      font-weight: 400;
      letter-spacing: .04em;
      line-height: .9;
      text-shadow: 2px 3px 0 rgba(0, 0, 0, .55);
      transform: rotate(-4deg);
    }

    .now-playing {
      display: grid;
      grid-template-columns: 64px 1fr 46px;
      gap: 12px;
      align-items: center;
      padding: 10px 18px 8px;
    }
    .cover {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: url("FOTO/cover.jpg") center/cover no-repeat;
      box-shadow: 0 10px 18px rgba(0,0,0,0.4);
    }
    .track-title {
      margin: 0 0 3px;
      font-weight: 700;
      font-size: 0.96rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
    }
    .play-button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #f4f0ea;
      color: #111;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .play-button svg { width: 16px; height: 16px; }

    .progress-wrap { padding: 0 18px 8px; }
    .progress {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(90deg, #f4efe9 var(--played, 0%), rgba(255,255,255,0.18) var(--played, 0%));
      border-radius: 99px;
    }
    .progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #f4efe9;
      border: 0;
    }
    .progress::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #f4efe9;
      border: 0;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #8d8a84;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    .track-list {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 6px 8px 10px;
    }
    .track {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .track[aria-current="true"], .track:hover { background: rgba(255,255,255,0.05); }
    .track-number,
    .track-length { color: #8d8a84; font-size: 0.72rem; }
    .track-name { font-size: 0.84rem; }

    .player-message {
      min-height: 18px;
      margin: 0;
      padding: 0 18px 12px;
      color: #ffd2a6;
      font-size: 0.74rem;
    }

    .promo-banner {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(440px, calc(100vw - 28px));
      padding: 18px 18px 16px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(11,12,14,0.92);
      box-shadow: 0 24px 52px rgba(0,0,0,0.5);
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .promo-banner.visible {
      opacity: 1;
      visibility: visible;
    }
    .promo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .promo-kicker {
      margin: 0;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d9d2c6;
      font-weight: 800;
    }
    .promo-close {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      cursor: pointer;
    }
    .promo-banner p {
      margin: 0 0 12px;
      text-align: center;
      line-height: 1.5;
      font-size: 0.96rem;
    }
    .promo-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .promo-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    audio { display: none; }

    footer {
      position: relative;
      z-index: 1;
      width: min(440px, calc(100% - 28px));
      margin: 0 auto;
      padding: 10px 0 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(255,255,255,0.54);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
    }
  </style>
</head>

        if (!Number.isFinite(sec)) return '0:00';
        const mins = Math.floor(sec / 60);
        const secs = Math.floor(sec % 60);
        return `${mins}:${String(secs).padStart(2, '0')}`;
      }

      function setProgress(value) {
        progress.style.setProperty('--played', `${value}%`);
        progress.value = value;
      }

      function loadTrack(index) {
        activeTrack = index;
        audio.src = tracks[index].src;
        audio.load();
        title.textContent = tracks[index].title;
        currentTime.textContent = '0:00';
        duration.textContent = '0:00';
        setProgress(0);
        message.textContent = '';
        trackButtons.forEach((btn, i) => {
          btn.setAttribute('aria-current', i === index ? 'true' : 'false');
        });
      }

      function playTrack() {
        audio.muted = true;
        audio.play().then(() => {
          audio.muted = false;
        }).catch(() => {
          message.textContent = 'Autoplay bloccato dal browser. Clicca il pulsante play per attivare l’audio.';
        });
      }

      function showBanner() {
        if (bannerShown) return;
        bannerShown = true;
        if (!audio.paused) audio.pause();
        promoBanner.classList.add('visible');
      }

      function hideBanner() {
        promoBanner.classList.remove('visible');
      }

      playButton.addEventListener('click', () => {
        audio.muted = false;
        if (audio.paused) {
          audio.play().catch(() => {
            message.textContent = 'Impossibile avviare il brano.';
          });
        } else {
          audio.pause();
        }
      });

      trackButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.index);
          bannerShown = false;
          hideBanner();
          loadTrack(index);
          audio.muted = true;
          audio.play().then(() => {
            audio.muted = false;
          }).catch(() => {
            message.textContent = 'Clicca il tasto play per attivare la musica.';
          });
        });
      });

      promoClose.addEventListener('click', hideBanner);

      audio.addEventListener('play', () => {
        playIcon.innerHTML = `<path fill="currentColor" d="M7 6h3.2v12H7zm6.8 0H17v12h-3.2z"/>`;
      });
      audio.addEventListener('pause', () => {
        playIcon.innerHTML = `<path fill="currentColor" d="M8 5.5v13l11-6.5L8 5.5z"/>`;
      });
      audio.addEventListener('loadedmetadata', () => {
        duration.textContent = formatTime(audio.duration);
        const len = trackButtons[activeTrack].querySelector('.track-length');
        if (len) len.textContent = formatTime(audio.duration);
      });
      audio.addEventListener('timeupdate', () => {
        currentTime.textContent = formatTime(audio.currentTime);
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          const pct = (audio.currentTime / audio.duration) * 100;
          setProgress(pct);
        }
        if (audio.currentTime >= 15 && !bannerShown) {
          showBanner();
        }
      });
      audio.addEventListener('ended', () => {
        const next = (activeTrack + 1) % tracks.length;
        loadTrack(next);
        playTrack();
      });
      audio.addEventListener('error', () => {
        message.textContent = 'File audio non disponibile. Controlla la cartella CANZONI.';
      });

      progress.addEventListener('input', () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = (Number(progress.value) / 100) * audio.duration;
        }
      });

      video.addEventListener('loadeddata', () => {
        video.play().catch(() => {});
      });

      menuBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        const isOpen = menu.classList.toggle('open');
        menu.setAttribute('aria-hidden', String(!isOpen));
      });
      document.addEventListener('click', (event) => {
        if (!menu.contains(event.target) && !menuBtn.contains(event.target)) {
          menu.classList.remove('open');
          menu.setAttribute('aria-hidden', 'true');
        }
      });

      tracks.forEach((track, index) => {
        const probe = new Audio();
        probe.preload = 'metadata';
        probe.src = track.src;
        probe.addEventListener('loadedmetadata', () => {
          const slot = trackButtons[index].querySelector('.track-length');
          if (slot) slot.textContent = formatTime(probe.duration);
        });
      });

      loadTrack(4);
      playTrack();
      setTimeout(() => {
        if (!bannerShown) showBanner();
      }, AUTO_BANNER_DELAY);
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
